[project]
name = "rechenwesen"
version = "0.1.0"
description = "Flask service that turns scanned receipts into PDFs and uploads them to WebDAV"
requires-python = ">=3.10"
dependencies = [
    "easywebdav==1.2.0",
    "flask>=3.1.3",
    "gunicorn>=23.0.0",
    "jinja2>=3.1.6",
    "weasyprint>=70.0",
    "werkzeug>=3.1.6",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
